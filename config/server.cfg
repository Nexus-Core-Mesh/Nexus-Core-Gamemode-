# SA:MP Server Configuration
# Base game mode
gamemode0 gtasa_reallife 1

# Plugins order
plugins crashdetect streamer sscanf2 sqlite mysql zcmd

# Server details
hostname GTA:SA Reallife Modular
maxplayers 100
port 7777
query 1
lanmode 0
rcon_password changeme
announce 0
weburl http://localhost
maxnpc 0

# Logging
logtimeformat [%H:%M:%S]

# Database / script deps (if used by the host environment)
# Set these values as needed by your server launcher.
# Example: mysql default values
# mysql_host localhost
# mysql_user root
# mysql_pass secret
# mysql_db gtasa_reallife
