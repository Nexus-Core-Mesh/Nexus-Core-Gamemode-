name: Build Gamemode

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build directories
        run: |
          mkdir -p data/db Compiler/samp03/gamemodes Compiler/samp03/data/db

      - name: Install 32-bit build runtime
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-user libc6-i386 lib32gcc-s1 lib32stdc++6 zlib1g:i386 libgcc-s1:i386

      - name: Compile gamemode
        env:
          SA_SERVER_ROOT: ${{ github.workspace }}/Compiler/samp03
          SQLITE_DB_PATH: ${{ github.workspace }}/Compiler/samp03/data/db/gtasa_reallife.db
          LD_LIBRARY_PATH: ${{ github.workspace }}/Compiler/pawncc${{ env.LD_LIBRARY_PATH != '' && format(':{0}', env.LD_LIBRARY_PATH) || '' }}
        run: |
          mkdir -p Compiler/samp03/gamemodes Compiler/samp03/data/db
          rm -f Compiler/samp03/gamemodes/gtasa_reallife.amx
          qemu-i386 Compiler/pawncc/pawncc \
            -o"$SA_SERVER_ROOT/gamemodes/gtasa_reallife.amx" \
            gamemodes/gamemode.pwn \
            -iincludes \
            -iCompiler/samp03/include \
            -d3
          python3 tools/patch_legacy_amx_version.py "$SA_SERVER_ROOT/gamemodes/gtasa_reallife.amx"

      - name: Verify AMX target name
        run: |
          test -f Compiler/samp03/gamemodes/gtasa_reallife.amx
          ls -l Compiler/samp03/gamemodes/gtasa_reallife.amx

      - name: Upload compiled gamemode
        uses: actions/upload-artifact@v4
        with:
          name: gtasa_reallife-amx
          path: Compiler/samp03/gamemodes/gtasa_reallife.amx
