# SQLite-first database configuration for the GTA:SA Reallife project.
# This file is intentionally simple and is designed to be replaced by a MySQL-ready
# adapter later without changing the modular server logic.

# SQLite backend
sqlite_db_path "data/db/gtasa_reallife.db"

# MySQL placeholder (disabled by default)
mysql_enabled 0
mysql_host "localhost"
mysql_user "root"
mysql_pass ""
mysql_db "gtasa_reallife"
